[project]
name = "ezcad2"
version = "0.1.0"
description = "Driver library for BJJCZ LMC galvo laser controllers (EZCad2)"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "pyusb>=1.2",
]

[project.urls]
Homepage = "https://github.com/nerdocs/pyrograph"
Repository = "https://github.com/nerdocs/pyrograph"
Issues = "https://github.com/nerdocs/pyrograph/issues"
Documentation = "https://github.com/nerdocs/pyrograph/blob/main/docs/galvo.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ezcad2"]
