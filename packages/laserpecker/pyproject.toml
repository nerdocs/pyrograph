[project]
name = "laserpecker"
version = "0.1.0"
description = "Driver library for LaserPecker laser engravers"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "pyserial>=3.5",
    "pillow>=10.0",
    "bleak>=0.22",
]

[project.urls]
Homepage = "https://github.com/nerdocs/pyrograph"
Repository = "https://github.com/nerdocs/pyrograph"
Issues = "https://github.com/nerdocs/pyrograph/issues"
Documentation = "https://github.com/nerdocs/pyrograph/blob/main/docs/protocol.md"

[project.scripts]
laserpecker = "laserpecker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laserpecker"]
