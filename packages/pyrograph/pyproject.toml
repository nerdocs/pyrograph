[project]
name = "pyrograph"
version = "0.1.0"
description = "Open laser engraving software — design, position and engrave"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "laserpecker>=0.1.0",
    "PySide6>=6.7",
    "numpy>=1.26",
]

[project.scripts]
pyrograph = "pyrograph.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrograph"]

# Local development resolves laserpecker from the workspace; the published
# wheel keeps the plain version requirement above.
[tool.uv.sources]
laserpecker = { workspace = true }
